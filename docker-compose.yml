services:

  postgres:
    image: postgres:17
    container_name: einfachpatho_postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ghcr.io/developerrucel07/einfachpatho-backend:latest

    container_name: einfachpatho_backend
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 core.wsgi:application --timeout 300"

    volumes:
      - ./staticfiles:/app/staticfiles

    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=false
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres  
      - DB_PORT=5432
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}

    env_file:
      - .env

    depends_on:
      - postgres

  frontend:
    image: ghcr.io/developerrucel07/einfachpatho-frontend:latest
    container_name: einfachpatho_frontend
    volumes:
      - ./nginx/nginx_pwa.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: einfachpatho_nginx
    ports:
      - "8085:80"
    volumes:
      - ./staticfiles:/var/www/static:ro
      - ./nginx/nginx_gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  django_static: